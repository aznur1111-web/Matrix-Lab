/* ============================================================
   Numerical linear algebra library (teaching implementations)
   ============================================================ */
function matCopy(A){return A.map(r=>r.slice())}
function eye(n){return Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0))}
function zeros(n,m){return Array.from({length:n},()=>new Array(m).fill(0))}
function matAdd(A,B){return A.map((row,i)=>row.map((v,j)=>v+B[i][j]))}
function matSub(A,B){return A.map((row,i)=>row.map((v,j)=>v-B[i][j]))}
function matMul(A,B){
 const n=A.length,k=B.length,m=B[0].length;
 const C=zeros(n,m);
 for(let i=0;i<n;i++)for(let j=0;j<m;j++){let s=0;for(let p=0;p<k;p++)s+=A[i][p]*B[p][j];C[i][j]=s}
 return C;
}
function matTranspose(A){return A[0].map((_,j)=>A.map(r=>r[j]))}
function matVecMul(A,x){return A.map(row=>row.reduce((s,v,i)=>s+v*x[i],0))}
function dot(a,b){return a.reduce((s,v,i)=>s+v*b[i],0)}
function norm1(v){return v.reduce((s,x)=>s+Math.abs(x),0)}
function norm2(v){return Math.sqrt(dot(v,v))}
function normInf(v){return Math.max(...v.map(Math.abs))}
function frob(A){let s=0;for(const r of A)for(const x of r)s+=x*x;return Math.sqrt(s)}
function trace(A){let s=0;for(let i=0;i<A.length;i++)s+=A[i][i];return s}

function luDecomp(A){
 const n=A.length;
 const U=matCopy(A);
 const L=eye(n);
 const P=eye(n);
 let sign=1;
 for(let k=0;k<n;k++){
  let maxV=Math.abs(U[k][k]),maxI=k;
  for(let i=k+1;i<n;i++)if(Math.abs(U[i][k])>maxV){maxV=Math.abs(U[i][k]);maxI=i}
  if(maxV<1e-14)continue;
  if(maxI!==k){
   [U[k],U[maxI]]=[U[maxI],U[k]];
   [P[k],P[maxI]]=[P[maxI],P[k]];
   for(let j=0;j<k;j++)[L[k][j],L[maxI][j]]=[L[maxI][j],L[k][j]];
   sign=-sign;
  }
  for(let i=k+1;i<n;i++){
   const m=U[i][k]/U[k][k];
   L[i][k]=m;
   for(let j=k;j<n;j++)U[i][j]-=m*U[k][j];
  }
 }
 return{L,U,P,sign};
}
function detFromLU(lu){let d=lu.sign;for(let i=0;i<lu.U.length;i++)d*=lu.U[i][i];return d}

function forwardSub(L,b){
 const n=L.length;const x=new Array(n).fill(0);
 for(let i=0;i<n;i++){
  let s=b[i];
  for(let j=0;j<i;j++)s-=L[i][j]*x[j];
  x[i]=s/L[i][i];
 }
 return x;
}
function backSub(U,b){
 const n=U.length;const x=new Array(n).fill(0);
 for(let i=n-1;i>=0;i--){
  let s=b[i];
  for(let j=i+1;j<n;j++)s-=U[i][j]*x[j];
  x[i]=s/U[i][i];
 }
 return x;
}

function cholesky(A){
 const n=A.length;
 const L=zeros(n,n);
 for(let i=0;i<n;i++)for(let j=0;j<=i;j++){
  let s=A[i][j];
  for(let k=0;k<j;k++)s-=L[i][k]*L[j][k];
  if(i===j){
   if(s<=0)throw Error('Matrix is not positive definite');
   L[i][j]=Math.sqrt(s);
  } else {
   if(L[j][j]<1e-14)throw Error('Zero pivot');
   L[i][j]=s/L[j][j];
  }
 }
 return L;
}

function qrHouseholder(A){
 const m=A.length,n=A[0].length;
 const R=matCopy(A);
 const Qt=eye(m);
 const steps=Math.min(m-1,n);
 for(let k=0;k<steps;k++){
  const x=[];
  for(let i=k;i<m;i++)x.push(R[i][k]);
  const xnorm=norm2(x);
  if(xnorm<1e-14)continue;
  const alpha=-Math.sign(x[0]||1)*xnorm;
  const v=x.slice();v[0]-=alpha;
  const vn2=dot(v,v);
  if(vn2<1e-20)continue;
  for(let j=k;j<n;j++){
   let s=0;
   for(let i=k;i<m;i++)s+=v[i-k]*R[i][j];
   const f=2*s/vn2;
   for(let i=k;i<m;i++)R[i][j]-=f*v[i-k];
  }
  for(let j=0;j<m;j++){
   let s=0;
   for(let i=k;i<m;i++)s+=v[i-k]*Qt[i][j];
   const f=2*s/vn2;
   for(let i=k;i<m;i++)Qt[i][j]-=f*v[i-k];
  }
 }
 return{Q:matTranspose(Qt),R};
}

function gramSchmidt(A,modified){
 const m=A.length,n=A[0].length;
 const Q=zeros(m,n);
 const R=zeros(n,n);
 const cols=[];
 for(let j=0;j<n;j++){
  const aj=A.map(r=>r[j]);
  let v=aj.slice();
  for(let i=0;i<j;i++){
   const qi=cols[i];
   const target=modified?v:aj;
   const r=dot(qi,target);
   R[i][j]=r;
   v=v.map((x,k)=>x-r*qi[k]);
  }
  const nrm=norm2(v);
  if(nrm<1e-14)throw Error('Columns are linearly dependent');
  R[j][j]=nrm;
  cols[j]=v.map(x=>x/nrm);
 }
 for(let j=0;j<n;j++)for(let i=0;i<m;i++)Q[i][j]=cols[j][i];
 return{Q,R};
}

function jacobiEigen(A){
 const n=A.length;
 const a=matCopy(A);
 const V=eye(n);
 for(let sweep=0;sweep<100;sweep++){
  let off=0;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)off+=a[i][j]*a[i][j];
  if(Math.sqrt(2*off)<1e-14)break;
  for(let p=0;p<n;p++)for(let q=p+1;q<n;q++){
   if(Math.abs(a[p][q])<1e-15)continue;
   const theta=(a[q][q]-a[p][p])/(2*a[p][q]);
   const t=Math.sign(theta||1)/(Math.abs(theta)+Math.sqrt(theta*theta+1));
   const c=1/Math.sqrt(t*t+1);
   const s=t*c;
   for(let i=0;i<n;i++){
    const aip=a[i][p],aiq=a[i][q];
    a[i][p]=c*aip-s*aiq;
    a[i][q]=s*aip+c*aiq;
   }
   for(let i=0;i<n;i++){
    const api=a[p][i],aqi=a[q][i];
    a[p][i]=c*api-s*aqi;
    a[q][i]=s*api+c*aqi;
   }
   for(let i=0;i<n;i++){
    const vip=V[i][p],viq=V[i][q];
    V[i][p]=c*vip-s*viq;
    V[i][q]=s*vip+c*viq;
   }
  }
 }
 const eigenvalues=Array.from({length:n},(_,i)=>a[i][i]);
 return{eigenvalues,eigenvectors:V};
}

function svdFromEigen(A){
 const m=A.length,n=A[0].length;
 const At=matTranspose(A);
 const AtA=matMul(At,A);
 const{eigenvalues,eigenvectors}=jacobiEigen(AtA);
 const idx=eigenvalues.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]);
 const sv=idx.map(([v,i])=>Math.sqrt(Math.max(0,v)));
 // V is n by n, columns are right singular vectors
 const V=Array.from({length:n},(_,i)=>idx.map(([_,j])=>eigenvectors[i][j]));
 // U is m by min(m,n) with columns A v_i / sigma_i
 const U=Array.from({length:m},(_,i)=>idx.map(([_,j],k)=>{
  if(sv[k]<1e-14)return 0;
  let s=0;
  for(let p=0;p<n;p++)s+=A[i][p]*V[p][k];
  return s/sv[k];
 }));
 return{U,sv,V};
}

function matInverse(A){
 const n=A.length;
 const M=A.map((row,i)=>[...row,...eye(n)[i]]);
 for(let i=0;i<n;i++){
  let maxV=Math.abs(M[i][i]),maxI=i;
  for(let k=i+1;k<n;k++)if(Math.abs(M[k][i])>maxV){maxV=Math.abs(M[k][i]);maxI=k}
  if(maxV<1e-14)throw Error('Matrix is singular');
  [M[i],M[maxI]]=[M[maxI],M[i]];
  const piv=M[i][i];
  for(let j=0;j<2*n;j++)M[i][j]/=piv;
  for(let k=0;k<n;k++){
   if(k===i)continue;
   const f=M[k][i];
   for(let j=0;j<2*n;j++)M[k][j]-=f*M[i][j];
  }
 }
 return M.map(row=>row.slice(n));
}

function matExp(A){
 const n=A.length;
 const nrm=Math.max(...A.map(row=>row.reduce((s,v)=>s+Math.abs(v),0)));
 const s=Math.max(0,Math.ceil(Math.log2(nrm+1))+1);
 const B=A.map(row=>row.map(v=>v/Math.pow(2,s)));
 let result=eye(n);
 let term=eye(n);
 for(let k=1;k<30;k++){
  term=matMul(term,B).map(row=>row.map(v=>v/k));
  let newResult=result.map((row,i)=>row.map((v,j)=>v+term[i][j]));
  result=newResult;
  let tn=0;for(const row of term)for(const v of row)tn+=Math.abs(v);
  if(tn<1e-16)break;
 }
 for(let i=0;i<s;i++)result=matMul(result,result);
 return result;
}

function strassen(A,B){
 const n=A.length;
 if(n<=2)return matMul(A,B);
 const h=n/2;
 const A11=A.slice(0,h).map(r=>r.slice(0,h));
 const A12=A.slice(0,h).map(r=>r.slice(h));
 const A21=A.slice(h).map(r=>r.slice(0,h));
 const A22=A.slice(h).map(r=>r.slice(h));
 const B11=B.slice(0,h).map(r=>r.slice(0,h));
 const B12=B.slice(0,h).map(r=>r.slice(h));
 const B21=B.slice(h).map(r=>r.slice(0,h));
 const B22=B.slice(h).map(r=>r.slice(h));
 const M1=strassen(matAdd(A11,A22),matAdd(B11,B22));
 const M2=strassen(matAdd(A21,A22),B11);
 const M3=strassen(A11,matSub(B12,B22));
 const M4=strassen(A22,matSub(B21,B11));
 const M5=strassen(matAdd(A11,A12),B22);
 const M6=strassen(matSub(A21,A11),matAdd(B11,B12));
 const M7=strassen(matSub(A12,A22),matAdd(B21,B22));
 const C11=matAdd(matSub(matAdd(M1,M4),M5),M7);
 const C12=matAdd(M3,M5);
 const C21=matAdd(M2,M4);
 const C22=matAdd(matSub(matAdd(M1,M3),M2),M6);
 const C=zeros(n,n);
 for(let i=0;i<h;i++)for(let j=0;j<h;j++){
  C[i][j]=C11[i][j];
  C[i][j+h]=C12[i][j];
  C[i+h][j]=C21[i][j];
  C[i+h][j+h]=C22[i][j];
 }
 return C;
}

function kron(A,B){
 const m=A.length,n=A[0].length,p=B.length,q=B[0].length;
 const C=zeros(m*p,n*q);
 for(let i=0;i<m;i++)for(let j=0;j<n;j++)for(let k=0;k<p;k++)for(let l=0;l<q;l++){
  C[i*p+k][j*q+l]=A[i][j]*B[k][l];
 }
 return C;
}
function hadamard(A,B){return A.map((row,i)=>row.map((v,j)=>v*B[i][j]))}

function jacobiIter(A,b,iters,tol){
 const n=A.length;
 let x=new Array(n).fill(0);
 const hist=[];
 for(let it=0;it<iters;it++){
  const xn=new Array(n);
  for(let i=0;i<n;i++){
   let s=b[i];
   for(let j=0;j<n;j++)if(j!==i)s-=A[i][j]*x[j];
   xn[i]=s/A[i][i];
  }
  x=xn;
  const r=A.map((row,i)=>row.reduce((s,v,j)=>s+v*x[j],0)-b[i]);
  hist.push(norm2(r));
  if(norm2(r)<tol)break;
 }
 return{x,hist};
}
function gaussSeidel(A,b,iters,tol,omega=1){
 const n=A.length;
 let x=new Array(n).fill(0);
 const hist=[];
 for(let it=0;it<iters;it++){
  for(let i=0;i<n;i++){
   let s=b[i];
   for(let j=0;j<n;j++)if(j!==i)s-=A[i][j]*x[j];
   x[i]=(1-omega)*x[i]+omega*s/A[i][i];
  }
  const r=A.map((row,i)=>row.reduce((s,v,j)=>s+v*x[j],0)-b[i]);
  hist.push(norm2(r));
  if(norm2(r)<tol)break;
 }
 return{x,hist};
}
function conjugateGradient(A,b,iters,tol){
 const n=A.length;
 let x=new Array(n).fill(0);
 let r=b.slice();
 let p=r.slice();
 let rs=dot(r,r);
 const hist=[Math.sqrt(rs)];
 for(let it=0;it<iters;it++){
  const Ap=matVecMul(A,p);
  const alpha=rs/dot(p,Ap);
  x=x.map((xi,i)=>xi+alpha*p[i]);
  r=r.map((ri,i)=>ri-alpha*Ap[i]);
  const rsNew=dot(r,r);
  hist.push(Math.sqrt(rsNew));
  if(Math.sqrt(rsNew)<tol)break;
  const beta=rsNew/rs;
  p=r.map((ri,i)=>ri+beta*p[i]);
  rs=rsNew;
 }
 return{x,hist};
}
function powerIteration(A,iters){
 const n=A.length;
 let x=new Array(n).fill(0).map(()=>Math.random()*2-1);
 x=x.map(v=>v/norm2(x));
 let lambda=0;
 for(let it=0;it<iters;it++){
  const y=matVecMul(A,x);
  lambda=dot(x,y);
  const nrm=norm2(y);
  if(nrm<1e-14)break;
  x=y.map(v=>v/nrm);
 }
 return{lambda,x};
}

/* ============================================================
   Formatting helpers
   ============================================================ */
function fmtNum(x,d=4){
 if(!Number.isFinite(x))return String(x);
 if(Math.abs(x)<1e-14)return '0';
 if(Math.abs(x)>=1e6||Math.abs(x)<1e-4)return x.toExponential(d-1);
 return parseFloat(x.toFixed(d)).toString();
}
function fmtMat(A,d=4,width=10){
 if(!A.length)return '(empty)';
 const strs=A.map(row=>row.map(x=>fmtNum(x,d)));
 const w=Math.max(width,...strs.flat().map(s=>s.length))+1;
 return strs.map(row=>row.map(s=>s.padStart(w)).join(' ')).join('\n');
}
function fmtVec(v,d=4){return v.map(x=>fmtNum(x,d)).join(', ')}

/* ============================================================
   Parsing
   ============================================================ */
function parseMatrix(s){
 const rows=s.trim().split(/\n/).map(row=>row.trim()).filter(Boolean).map(row=>row.split(/[\s,]+/).filter(Boolean).map(Number));
 if(!rows.length)throw Error('Enter a matrix with one row per line');
 const cols=rows[0].length;
 if(rows.some(r=>r.length!==cols))throw Error('All rows must have the same number of columns');
 if(rows.some(r=>r.some(x=>!Number.isFinite(x))))throw Error('All entries must be numbers');
 return rows;
}
function parseMatrixAndVector(s){
 const blocks=s.trim().split(/\n\s*\n/);
 if(blocks.length<2)throw Error('Enter the matrix rows, a blank line, then the right hand side vector');
 const A=parseMatrix(blocks[0]);
 const b=blocks[1].trim().split(/[\s,]+/).filter(Boolean).map(Number);
 if(b.some(x=>!Number.isFinite(x)))throw Error('All vector entries must be numbers');
 if(b.length!==A.length)throw Error('Vector length must match matrix size');
 return{A,b};
}
function parseVector(s){
 return s.trim().split(/[\s,]+/).filter(Boolean).map(Number);
}

function demoMatrixBasics(text){
 const A=parseMatrix(text);
 const m=A.length,n=A[0].length;
 const At=matTranspose(A);
 const tr=trace(A);
 let det='n/a (not square)';
 if(m===n){try{const lu=luDecomp(A);det=fmtNum(detFromLU(lu))}catch(e){}}
 const fro=frob(A);
 const oneNorm=m===n?Math.max(...Array.from({length:n},(_,j)=>A.reduce((s,r)=>s+Math.abs(r[j]),0))):'n/a';
 const infNorm=Math.max(...A.map(r=>r.reduce((s,v)=>s+Math.abs(v),0)));
 const A2=norm2;
 let cond='n/a';
 if(m===n){
  try{
   const{U,sv}=svdFromEigen(A);
   const smax=sv[0],smin=sv[sv.length-1];
   if(smin>1e-14)cond=fmtNum(smax/smin,3);
  }catch(e){}
 }
 return {
  encoded:`A (${m} by ${n}):\n${fmtMat(A)}\n\nA^T (${n} by ${m}):\n${fmtMat(At)}\n\ntrace(A)         = ${fmtNum(tr)}\nFrobenius norm   = ${fmtNum(fro)}\n1 norm (matrix)  = ${typeof oneNorm==='number'?fmtNum(oneNorm):oneNorm}\ninfinity norm    = ${fmtNum(infNorm)}\ndeterminant      = ${det}\ncondition number = ${cond}`,
  decoded:`Matrix operations in one place. The transpose swaps rows and columns. The trace sums the diagonal. The determinant measures the volume scaling. The norms measure the size of the matrix in different ways.\n\nFrobenius norm is the square root of the sum of squares of all entries. The matrix 1 norm is the maximum absolute column sum. The matrix infinity norm is the maximum absolute row sum. The matrix 2 norm is the largest singular value.\n\nA large condition number means the matrix is close to singular and results are sensitive to input errors.`,
  steps:m*n,units:1,tokens:1
 };
}

function demoVectorNorms(text){

 return {
  encoded:`vector (${v.length} entries): ${fmtVec(v)}\n\n1 norm        = ${fmtNum(n1)}\n2 norm        = ${fmtNum(n2)}\ninfinity norm = ${fmtNum(ni)}\nunit vector   = ${fmtVec(u)}\n||unit||_2    = ${fmtNum(norm2(u))}`,
  decoded:`The 1 norm is the sum of absolute values, also called the taxicab distance. The 2 norm is the Euclidean length. The infinity norm is the largest absolute entry.\n\nBounds: ||x||_2 <= ||x||_1 <= sqrt(n) * ||x||_2. So all three norms are within a factor sqrt(n) of each other, but they can be very different for a particular vector.`,
  steps:v.length,units:3,tokens:3
 };
}

function demoConditioning(text){
 const A=parseMatrix(text);
 const m=A.length,n=A[0].length;
 if(m!==n)throw Error('Condition number is defined for square matrices');
 const{U,sv}=svdFromEigen(A);
 const smax=sv[0],smin=sv[sv.length-1];
 const cond=smin>1e-14?smax/smin:Infinity;
 const digits=cond>0&&Number.isFinite(cond)?Math.max(0,16-Math.log10(cond)):16;
 const rows=sv.map((s,i)=>`  sigma ${String(i+1).padStart(2)} = ${fmtNum(s,6)}`);
 return {
  encoded:`A (${m} by ${n}):\n${fmtMat(A)}\n\nSingular values:\n${rows.join('\n')}\n\nlargest  sigma_max = ${fmtNum(smax,6)}\nsmallest sigma_min = ${fmtNum(smin,6)}\ncondition number   = ${fmtNum(cond,4)}\nreliable digits    = about ${fmtNum(digits,1)} (in double precision)`,
  decoded:`The condition number measures how much the solution of A x = b can change when b or A changes slightly. A large condition number means the problem is ill conditioned and small errors get amplified.\n\nRule of thumb: if kappa is about 10^k, you lose about k digits of accuracy. Double precision has about 16 digits, so kappa = 10^10 leaves only about 6 reliable digits.\n\nThe Hilbert matrix is the classic example of an ill conditioned matrix. Its condition number grows exponentially with size.`,
  steps:m*n,units:1,tokens:1
 };
}

function demoGaussianElimination(text){
 const{A,b}=parseMatrixAndVector(text);
 if(A.length!==A[0].length)throw Error('Matrix must be square');
 const n=A.length;
 const M=A.map((row,i)=>[...row,b[i]]);
 const steps=[];
 for(let k=0;k<n-1;k++){
  let maxV=Math.abs(M[k][k]),maxI=k;
  for(let i=k+1;i<n;i++)if(Math.abs(M[i][k])>maxV){maxV=Math.abs(M[i][k]);maxI=i}
  if(maxI!==k){
   [M[k],M[maxI]]=[M[maxI],M[k]];
   steps.push(`swap row ${k} and ${maxI}`);
  }
  if(Math.abs(M[k][k])<1e-14)throw Error('Matrix is singular');
  for(let i=k+1;i<n;i++){
   const m=M[i][k]/M[k][k];
   for(let j=k;j<=n;j++)M[i][j]-=m*M[k][j];
  }
 }
 const x=new Array(n).fill(0);
 for(let i=n-1;i>=0;i--){
  let s=M[i][n];
  for(let j=i+1;j<n;j++)s-=M[i][j]*x[j];
  x[i]=s/M[i][i];
 }
 const r=matVecMul(A,x).map((v,i)=>v-b[i]);
 return {
  encoded:`Augmented system [A | b]:\n${fmtMat(M)}\n\nRow swaps performed: ${steps.length?steps.join(', '):'none'}\n\nSolution x:\n  ${fmtVec(x,6)}\n\nResidual ||b - A x|| = ${fmtNum(norm2(r),6)}`,
  decoded:`Gaussian elimination reduces the augmented matrix to upper triangular form. The back substitution then solves for the unknowns from the last row up.\n\nPartial pivoting chooses the largest available entry in the column as the pivot. This keeps the multipliers small and improves numerical stability.\n\nThe final residual should be close to machine epsilon times the size of the problem. If it is not, the matrix is ill conditioned.`,
  steps:n,units:n,tokens:n
 };
}

function demoLu(text){
 const A=parseMatrix(text);
 const n=A.length;
 if(n!==A[0].length)throw Error('LU requires a square matrix');
 const{L,U,P,sign}=luDecomp(A);
 // verify PA = LU
 const PA=matMul(P,A);
 const LU=matMul(L,U);
 let err=0;
 for(let i=0;i<n;i++)for(let j=0;j<n;j++)err=Math.max(err,Math.abs(PA[i][j]-LU[i][j]));
 const det=detFromLU({L,U,P,sign});
 return {
  encoded:`A:\n${fmtMat(A)}\n\nP:\n${fmtMat(P)}\n\nL:\n${fmtMat(L)}\n\nU:\n${fmtMat(U)}\n\nmax |PA - LU| = ${fmtNum(err,6)}\ndet(A) = ${fmtNum(det,6)}\nNumber of row swaps: ${sign===1?'even':'odd'}`,
  decoded:`LU decomposition factors A into a lower triangular matrix L and an upper triangular matrix U. Partial pivoting records row swaps in P, so PA = LU.\n\nOnce you have the factorization, solving for a new right hand side costs only two triangular solves, which is much faster than refactoring A.\n\nThe determinant is the product of the diagonal of U times the sign of the permutation. This is far more efficient than expanding the determinant by minors.`,
  steps:n,units:n,tokens:n
 };
}

function demoCholesky(text){

 if(n!==A[0].length)throw Error('Cholesky requires a square matrix');
 // check symmetry
 let symErr=0;
 for(let i=0;i<n;i++)for(let j=0;j<n;j++)symErr=Math.max(symErr,Math.abs(A[i][j]-A[j][i]));
 const L=cholesky(A);
 const Lt=matTranspose(L);
 const LLt=matMul(L,Lt);
 let err=0;
 for(let i=0;i<n;i++)for(let j=0;j<n;j++)err=Math.max(err,Math.abs(LLt[i][j]-A[i][j]));
 return {
  encoded:`A:\n${fmtMat(A)}\n\nSymmetry error max |A - A^T| = ${fmtNum(symErr,6)}\n\nL:\n${fmtMat(L)}\n\nL^T:\n${fmtMat(Lt)}\n\nmax |L L^T - A| = ${fmtNum(err,6)}\nDiagonal of L: ${L.map((r,i)=>fmtNum(r[i],4)).join(', ')}`,
  decoded:`The Cholesky factorization writes a symmetric positive definite matrix as A = L L^T with L lower triangular and positive diagonal.\n\nIt is twice as fast as LU because it uses the symmetry of A. No pivoting is needed, because the algorithm is always numerically stable when A is SPD.\n\nIf any diagonal entry of L would be zero or negative, A is not positive definite. This is the check that reveals the failure.`,
  steps:n,units:n,tokens:n
 };
}

function demoQr(text){
 const A=parseMatrix(text);
 const{Q,R}=qrHouseholder(A);
 const m=A.length,n=A[0].length;
 const QR=matMul(Q,R);
 let err=0;
 for(let i=0;i<m;i++)for(let j=0;j<n;j++)err=Math.max(err,Math.abs(QR[i][j]-A[i][j]));
 // check orthogonality
 const QtQ=matMul(matTranspose(Q),Q);
 let orthErr=0;
 for(let i=0;i<Q[0].length;i++)for(let j=0;j<Q[0].length;j++)orthErr=Math.max(orthErr,Math.abs(QtQ[i][j]-(i===j?1:0)));
 return {
  encoded:`A (${m} by ${n}):\n${fmtMat(A)}\n\nQ (${m} by ${Q[0].length}):\n${fmtMat(Q)}\n\nR (${R.length} by ${R[0].length}):\n${fmtMat(R)}\n\nmax |QR - A|        = ${fmtNum(err,6)}\nmax |Q^T Q - I|     = ${fmtNum(orthErr,6)}\nR is upper triangular: ${R.every((row,i)=>row.every((v,j)=>j>=i||Math.abs(v)<1e-12))?'yes':'no'}`,
  decoded:`The QR decomposition writes A = Q R with Q orthogonal and R upper triangular. This implementation uses Householder reflections, which are numerically stable.\n\nThe columns of Q are orthonormal, so Q^T Q = I. Multiplying by Q does not change vector lengths or angles, which is why QR is the method of choice for least squares.\n\nFor least squares, solve R x = Q^T b by back substitution. Only the top n rows of the transformed right hand side matter.`,
  steps:m*n,units:Math.min(m-1,n),tokens:1
 };
}

function demoEigen(text){
 const A=parseMatrix(text);
 const n=A.length;
 if(n!==A[0].length)throw Error('Eigendecomposition requires a square matrix');
 // check symmetry
 let sym=true;
 for(let i=0;i<n&&sym;i++)for(let j=0;j<n;j++)if(Math.abs(A[i][j]-A[j][i])>1e-10){sym=false;break}
 if(!sym)throw Error('This lab uses the Jacobi method which requires a symmetric matrix');
 const{eigenvalues,eigenvectors}=jacobiEigen(A);
 // sort descending
 const order=eigenvalues.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]);
 const evals=order.map(([v])=>v);
 const V=Array.from({length:n},(_,i)=>order.map(([_,j])=>eigenvectors[i][j]));
 const rows=evals.map((lam,i)=>{
  const v=V.map(row=>row[i]);
  const Av=matVecMul(A,v);
  const resid=Math.sqrt(dot(Av.map((x,k)=>x-lam*v[k]),Av.map((x,k)=>x-lam*v[k])));
  return `  lambda ${String(i+1).padStart(2)} = ${fmtNum(lam,6).padStart(12)}   residual ||Av - lambda v|| = ${fmtNum(resid,3)}`;
 });
 // reconstruct
 const Vt=matTranspose(V);
 const D=eye(n).map((row,i)=>row.map((v,j)=>i===j?evals[i]:0));
 const A_rec=matMul(matMul(V,D),Vt);
 let err=0;
 for(let i=0;i<n;i++)for(let j=0;j<n;j++)err=Math.max(err,Math.abs(A_rec[i][j]-A[i][j]));
 return {
  encoded:`A:\n${fmtMat(A)}\n\nEigenvalues (sorted):\n${rows.join('\n')}\n\nEigenvector matrix V (columns are eigenvectors):\n${fmtMat(V)}\n\nmax |V D V^T - A| = ${fmtNum(err,6)}`,
  decoded:`For a symmetric matrix, all eigenvalues are real and eigenvectors can be chosen orthonormal. The Jacobi method zeros off diagonal entries one at a time using plane rotations.\n\nEach eigenvalue and its eigenvector satisfy A v = lambda v. The residual should be near machine epsilon for a well conditioned symmetric matrix.\n\nEigenvectors of a symmetric matrix form an orthogonal basis. Any vector can be expanded in this basis, which is why eigendecomposition is so useful.`,
  steps:n,units:n*n,tokens:n
 };
}

function demoSvd(text){

 const m=A.length,n=A[0].length;
 const{U,sv,V}=svdFromEigen(A);
 const k=sv.length;
 // Build Sigma
 const Sigma=zeros(m,n);
 for(let i=0;i<k;i++)Sigma[i][i]=sv[i];
 const Vt=matTranspose(V);
 const USV=matMul(matMul(U,Sigma),Vt);
 let err=0;
 for(let i=0;i<m;i++)for(let j=0;j<n;j++)err=Math.max(err,Math.abs(USV[i][j]-A[i][j]));

  encoded:`A (${m} by ${n}):\n${fmtMat(A)}\n\nSingular values:\n${sv.map((s,i)=>`  sigma ${String(i+1).padStart(2)} = ${fmtNum(s,6)}`).join('\n')}\n\nU (${m} by ${U[0].length}):\n${fmtMat(U)}\n\nV^T (${Vt.length} by ${Vt[0].length}):\n${fmtMat(Vt)}\n\nmax |U Sigma V^T - A| = ${fmtNum(err,6)}\nrank          = ${rank}\n2 norm        = ${fmtNum(sv[0],6)}\nFrobenius     = ${fmtNum(Math.sqrt(sv.reduce((s,x)=>s+x*x,0)),6)}\ncondition     = ${sv[sv.length-1]>1e-14?fmtNum(sv[0]/sv[sv.length-1],4):'infinite'}`,
  decoded:`The SVD writes A = U Sigma V^T with U and V orthogonal and Sigma diagonal with non negative entries. It works for any matrix shape.\n\nSingular values are the square roots of the eigenvalues of A^T A. The columns of U are the left singular vectors, and the columns of V are the right singular vectors.\n\nThe rank of A equals the number of nonzero singular values. The best rank k approximation is the sum of the top k outer products sigma_i u_i v_i^T.`,
  steps:m*n,units:k,tokens:1
 };
}

function demoGramSchmidt(text){
 const A=parseMatrix(text);
 const m=A.length,n=A[0].length;
 let res=null,err=null;
 try{res={classical:gramSchmidt(A,false),modified:gramSchmidt(A,true)}}
 catch(e){err=e.message}
 if(err)throw Error(err);
 const rows=[];
 for(const[name,r] of Object.entries(res)){
  const{Q,R}=r;
  const QtQ=matMul(matTranspose(Q),Q);
  let orth=0;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++)orth=Math.max(orth,Math.abs(QtQ[i][j]-(i===j?1:0)));
  const QR=matMul(Q,R);
  let rec=0;
  for(let i=0;i<m;i++)for(let j=0;j<n;j++)rec=Math.max(rec,Math.abs(QR[i][j]-A[i][j]));
  rows.push(`  ${name.padEnd(10)}: orthogonality error = ${fmtNum(orth,3)}   reconstruction error = ${fmtNum(rec,3)}`);
 }
 const{modified:{Q,R}}=res;
 return {
  encoded:`A (${m} by ${n}):\n${fmtMat(A)}\n\nQ (from modified GS):\n${fmtMat(Q)}\n\nR (from modified GS):\n${fmtMat(R)}\n\nComparison:\n${rows.join('\n')}`,
  decoded:`Gram-Schmidt turns a set of independent vectors into an orthonormal set. Classical GS computes all projections from the original column. Modified GS updates the vector after each projection.\n\nModified GS is numerically more stable because it prevents cancellation. For nearly dependent columns the difference is dramatic.\n\nBoth methods share the same Q R = A relation, but the loss of orthogonality in classical GS can be much larger.`,
  steps:m*n,units:n,tokens:n
 };
}

function demoHouseholderGivens(text){
 const A=parseMatrix(text);
 const m=A.length,n=A[0].length;
 const{Q,R}=qrHouseholder(A);
 // Show one Householder reflector explicitly
 const x=[];
 for(let i=0;i<m;i++)x.push(A[i][0]);
 const xnorm=norm2(x);
 const alpha=-Math.sign(x[0]||1)*xnorm;
 const v=x.slice();v[0]-=alpha;
 const vn2=dot(v,v);
 const H=eye(m);
 for(let i=0;i<m;i++)for(let j=0;j<m;j++)H[i][j]-=2*v[i]*v[j]/vn2;
 const Hx=matVecMul(H,x);
 return {
  encoded:`First column of A: ${fmtVec(x)}\n\nHouseholder vector v:\n  ${fmtVec(v)}\n\nalpha = ${fmtNum(alpha)}\n||v||^2 = ${fmtNum(vn2)}\n\nHouseholder matrix H (m by m):\n${fmtMat(H)}\n\nH times first column of A:\n  ${fmtVec(Hx,6)}\n  (all entries except the first should be near zero)\n\nFull QR from Householder:\nQ (${m} by ${Q[0].length}):\n${fmtMat(Q)}\n\nR (${R.length} by ${R[0].length}):\n${fmtMat(R)}`,
  decoded:`A Householder reflector is an orthogonal matrix H = I - 2 v v^T / (v^T v). It reflects a vector across the hyperplane perpendicular to v.\n\nThe key property is H x = alpha e_1, which means H zeros out every entry of x except the first. Applying a sequence of Householders to A reduces it to upper triangular form, producing the QR decomposition.\n\nGivens rotations work differently: they zero out a single entry using a 2 by 2 rotation. They are useful for sparse matrices or when only a few entries need to be eliminated.`,
  steps:m*n,units:Math.min(m-1,n),tokens:1
 };
}

function demoJacobiGS(text){
 const{A,b}=parseMatrixAndVector(text);
 if(A.length!==A[0].length)throw Error('Matrix must be square');
 const n=A.length;
 const j=jacobiIter(A,b,200,1e-12);
 const gs=gaussSeidel(A,b,200,1e-12,1);
 const true_x=backSub(luDecomp(A).U,forwardSub(luDecomp(A).L,matVecMul(luDecomp(A).P,b)));
 const rows=[
  `  Jacobi        iterations = ${String(j.hist.length).padStart(3)}   final residual = ${fmtNum(j.hist[j.hist.length-1],3)}`,
  `  Gauss-Seidel  iterations = ${String(gs.hist.length).padStart(3)}   final residual = ${fmtNum(gs.hist[gs.hist.length-1],3)}`
 ];
 return {
  encoded:`A:\n${fmtMat(A)}\n\nb: ${fmtVec(b)}\n\n${rows.join('\n')}\n\nJacobi solution:      ${fmtVec(j.x,6)}\nGauss-Seidel solution: ${fmtVec(gs.x,6)}\nDirect solution:       ${fmtVec(true_x,6)}`,
  decoded:`Both Jacobi and Gauss-Seidel start from the zero vector and iterate until the residual is small. Jacobi uses the previous iterate for all updates. Gauss-Seidel uses the newest values as soon as they are available.\n\nThe convergence rate depends on the spectral radius of the iteration matrix. Diagonal dominance is a simple sufficient condition that guarantees convergence for any starting guess.\n\nGauss-Seidel typically converges about twice as fast as Jacobi for the same problem, but the exact factor depends on the matrix.`,
  steps:n,units:j.hist.length+gs.hist.length,tokens:n
 };
}

function demoSorCg(text){
 const{A,b}=parseMatrixAndVector(text);
 if(A.length!==A[0].length)throw Error('Matrix must be square');
 const n=A.length;
 // check SPD for CG
 let sym=true;
 for(let i=0;i<n&&sym;i++)for(let j=0;j<n;j++)if(Math.abs(A[i][j]-A[j][i])>1e-10){sym=false;break}
 const sorRes=[];const cgRes=[];
 for(const omega of [0.8,1.0,1.2,1.5]){
  const r=gaussSeidel(A,b,300,1e-12,omega);
  sorRes.push(`  SOR omega = ${omega.toFixed(1)}   iterations = ${String(r.hist.length).padStart(3)}   final residual = ${fmtNum(r.hist[r.hist.length-1],3)}`);
 }
 let cgOut='';
 if(sym){
  const cg=conjugateGradient(A,b,300,1e-12);
  cgOut=`  Conjugate gradient: iterations = ${cg.hist.length}   final residual = ${fmtNum(cg.hist[cg.hist.length-1],3)}\n  CG solution: ${fmtVec(cg.x,6)}`;
 } else {
  cgOut='  Conjugate gradient requires a symmetric matrix, skipped.';
 }
 return {
  encoded:`A:\n${fmtMat(A)}\n\nb: ${fmtVec(b)}\n\nSOR iterations (various omega):\n${sorRes.join('\n')}\n\n${cgOut}`,
  decoded:`SOR adds a relaxation parameter omega to Gauss-Seidel. When omega is between 1 and 2 the iteration often converges faster. When omega equals 1 the method is exactly Gauss-Seidel. Values between 0 and 1 give under relaxation and usually slow things down.\n\nConjugate gradient is the method of choice for large symmetric positive definite systems. In exact arithmetic it converges in at most n steps. In floating point it takes a few more, but the convergence is usually much faster than Jacobi or Gauss-Seidel.\n\nThe number of CG iterations depends on the square root of the condition number. A good preconditioner reduces that dramatically.`,
  steps:n,units:4+(sym?1:0),tokens:n
 };
}

function demoCsrCsc(text){
 const A=parseMatrix(text);
 const m=A.length,n=A[0].length;
 const values=[],colIdx=[],rowPtr=[0];
 for(let i=0;i<m;i++){
  for(let j=0;j<n;j++)if(A[i][j]!==0){values.push(A[i][j]);colIdx.push(j)}
  rowPtr.push(values.length);
 }
 const cscValues=[],cscRowIdx=[],colPtr=[0];
 for(let j=0;j<n;j++){
  for(let i=0;i<m;i++)if(A[i][j]!==0){cscValues.push(A[i][j]);cscRowIdx.push(i)}
  colPtr.push(cscValues.length);
 }
 const nnz=values.length;
 const density=nnz/(m*n);
 return {
  encoded:`A (${m} by ${n}):\n${fmtMat(A)}\n\nCSR representation:\n  values    = [${values.join(', ')}]\n  indices   = [${colIdx.join(', ')}]\n  indptr    = [${rowPtr.join(', ')}]\n\nCSC representation:\n  values    = [${cscValues.join(', ')}]\n  indices   = [${cscRowIdx.join(', ')}]\n  colptr    = [${colPtr.join(', ')}]\n\nnonzeros  = ${nnz} of ${m*n} entries\ndensity   = ${fmtNum(density*100,2)}%\nstorage   = ${nnz*2+(m+1)} numbers vs ${m*n} for dense\nsaving    = ${fmtNum((1-(nnz*2+(m+1))/(m*n))*100,1)}%`,
  decoded:`CSR (compressed sparse row) stores nonzeros row by row. The row pointer has length m+1 and says where each row starts. This is fast for row operations and matrix vector products.\n\nCSC (compressed sparse column) does the same thing column by column. It is faster for column operations, which is what most direct solvers need.\n\nBoth formats store only the nonzeros and their indices. For very sparse matrices this saves enormous amounts of memory. A dense matrix of the same size would store every entry including the zeros.`,
  steps:nnz,units:nnz,tokens:nnz
 };
}

function demoStrassen(text){
 const A=parseMatrix(text);
 const n=A.length;
 if(n!==A[0].length)throw Error('Use a square matrix for this lab');
 if((n&(n-1))!==0)throw Error('Strassen demo needs a power of two size (2, 4, 8, ...)');
 const B=matTranspose(A); // use transpose as a convenient second matrix
 const C_naive=matMul(A,B);
 const C_str= n<=2 ? C_naive : strassen(A,B);
 let diff=0;
 for(let i=0;i<n;i++)for(let j=0;j<n;j++)diff=Math.max(diff,Math.abs(C_naive[i][j]-C_str[i][j]));
 // flop counts
 const naive=n*n*n*2;
 const strassenFlops=n<=4?naive:Math.round(Math.pow(n,Math.log2(7))*2);
 return {
  encoded:`A (${n} by ${n}):\n${fmtMat(A)}\n\nB = A^T:\n${fmtMat(B)}\n\nA B (naive):\n${fmtMat(C_naive)}\n\nA B (Strassen):\n${fmtMat(C_str)}\n\nmax difference = ${fmtNum(diff,6)}\n\nApproximate flops:\n  naive    : ${naive}\n  Strassen : ${strassenFlops}`,
  decoded:`Strassen's algorithm multiplies two matrices using 7 recursive multiplications instead of 8 at each level. This gives asymptotic complexity O(n^2.807) instead of O(n^3).\n\nThe cost is a larger constant factor and slightly worse numerical stability. In practice BLAS libraries use the naive algorithm for small matrices and switch to Strassen only for very large ones.\n\nThis demo uses a small matrix so you can see the result. For large matrices the recursion is what gives the speedup.`,
  steps:n,units:naive,tokens:1
 };
}

function demoKroneckerHadamard(text){
 const A=parseMatrix(text);
 const m=A.length,n=A[0].length;
 const B=A; // use same matrix
 const K=kron(A,B);
 const H=hadamard(A,B);
 return {
  encoded:`A (${m} by ${n}):\n${fmtMat(A)}\n\nA kron A (${K.length} by ${K[0].length}):\n${fmtMat(K)}\n\nA .* A (Hadamard, ${H.length} by ${H[0].length}):\n${fmtMat(H)}\n\nKronecker shape: ${K.length} by ${K[0].length}\nHadamard shape: ${H.length} by ${H[0].length}`,
  decoded:`The Kronecker product replaces each entry A[i][j] with the whole matrix A scaled by A[i][j]. Its shape is (m p) by (n q) for A of size m by n and B of size p by q.\n\nThe Hadamard product multiplies the two matrices entry by entry. Both matrices must have the same shape.\n\nKronecker products describe separable transforms in signal processing and quantum computing. Hadamard products appear in neural networks, statistics and machine learning where they are often called elementwise multiplication.`,
  steps:K.length*K[0].length,units:K.length*K[0].length,tokens:1
 };
}

function demoMatrixFunctions(text){
 const A=parseMatrix(text);
 const n=A.length;
 if(n!==A[0].length)throw Error('Matrix exponential requires a square matrix');
 const E=matExp(A);
 // also show a few Taylor terms
 const I=eye(n);
 const A2=matMul(A,A);
 const A3=matMul(A2,A);
 const taylor=I.map((row,i)=>row.map((v,j)=>v+A[i][j]+A2[i][j]/2+A3[i][j]/6));
 return {
  encoded:`A:\n${fmtMat(A)}\n\nexp(A):\n${fmtMat(E)}\n\nTaylor I + A + A^2/2 + A^3/6:\n${fmtMat(taylor)}\n\ndifference from full exp: ${fmtNum(Math.max(...E.map((row,i)=>Math.max(...row.map((v,j)=>Math.abs(v-taylor[i][j]))))),3)}`,
  decoded:`The matrix exponential is defined by the same Taylor series as the scalar exponential: exp(A) = I + A + A^2/2! + A^3/3! + ...\n\nFor a diagonal matrix, exp(A) is the diagonal matrix with the exponentials of the diagonal entries. For a general matrix you must use the series, a Padé approximant, or the eigendecomposition.\n\nThis implementation uses scaling and squaring. Scale A down until its norm is small, apply the Taylor series, then square the result back up. This is the standard approach in numerical libraries.`,
  steps:n,units:n*n,tokens:1
 };
}

function demoMatrixInverse(text){
 const A=parseMatrix(text);
 const n=A.length;
 if(n!==A[0].length)throw Error('Matrix inverse requires a square matrix');
 const Ainv=matInverse(A);
 const I=eye(n);
 const AAinv=matMul(A,Ainv);
 let err=0;
 for(let i=0;i<n;i++)for(let j=0;j<n;j++)err=Math.max(err,Math.abs(AAinv[i][j]-I[i][j]));
 return {
  encoded:`A:\n${fmtMat(A)}\n\nA^-1:\n${fmtMat(Ainv)}\n\nA A^-1:\n${fmtMat(AAinv)}\n\nmax |A A^-1 - I| = ${fmtNum(err,6)}`,
  decoded:`The inverse is computed with Gauss-Jordan elimination on the augmented matrix [A | I]. Row operations reduce the left half to the identity, and the right half becomes A^-1.\n\nThe cost is twice that of LU. In production code, never compute the inverse to solve a linear system. Use LU or Cholesky instead, which are faster and numerically more stable.\n\nAlways verify by computing A A^-1 and checking that it is close to the identity. A large error means the matrix is ill conditioned.`,
  steps:n,units:n*n,tokens:1
 };
}

function demoShermanMorrison(text){
 const A=parseMatrix(text);
 const n=A.length;
 if(n!==A[0].length)throw Error('Sherman-Morrison requires a square matrix');
 const Ainv=matInverse(A);
 // rank one update with unit vectors
 const u=new Array(n).fill(0);u[0]=1;u[n-1]=-1;
 const v=new Array(n).fill(0);v[0]=0.5;v[n-1]=2;
 // Sherman-Morrison formula
 const AinvU=matVecMul(Ainv,u);
 const vAinv=matVecMul(matTranspose(Ainv),v); // v^T A^-1 = (A^-T v)^T
 const denom=1+dot(v,AinvU);
 if(Math.abs(denom)<1e-12)throw Error('Update is nearly singular');
 const AinvNew=Ainv.map((row,i)=>row.map((val,j)=>val-AinvU[i]*vAinv[j]/denom));
 // direct update
 const Anew=A.map((row,i)=>row.map((val,j)=>val+u[i]*v[j]));
 const AinvDirect=matInverse(Anew);
 let diff=0;
 for(let i=0;i<n;i++)for(let j=0;j<n;j++)diff=Math.max(diff,Math.abs(AinvNew[i][j]-AinvDirect[i][j]));
 return {
  encoded:`A:\n${fmtMat(A)}\n\nu: ${fmtVec(u)}\nv: ${fmtVec(v)}\n\ndenominator 1 + v^T A^-1 u = ${fmtNum(denom,6)}\n\n(A + u v^T)^-1 via Sherman-Morrison:\n${fmtMat(AinvNew)}\n\n(A + u v^T)^-1 via direct inverse:\n${fmtMat(AinvDirect)}\n\nmax difference = ${fmtNum(diff,6)}`,
  decoded:`The Sherman-Morrison formula gives the inverse of A + u v^T using the inverse of A. This avoids refactoring when only a rank one change is made.\n\nThe formula is (A + u v^T)^-1 = A^-1 - (A^-1 u v^T A^-1) / (1 + v^T A^-1 u). The denominator must be nonzero for the update to be invertible.\n\nThe Woodbury identity generalizes to rank k updates. It is used in Kalman filters, sequential least squares and BFGS quasi-Newton optimisation.`,
  steps:n,units:n*n,tokens:1
 };
}

function demoPseudoinverse(text){
 const A=parseMatrix(text);
 const m=A.length,n=A[0].length;
 const{U,sv,V}=svdFromEigen(A);
 const k=sv.length;
 const tol=1e-10;
 const svInv=sv.map(s=>s>tol?1/s:0);
 // A+ = V Sigma+ U^T
 const SigmaPlus=zeros(n,m);
 for(let i=0;i<k;i++)SigmaPlus[i][i]=svInv[i];
 const Ut=matTranspose(U);
 const Aplus=matMul(matMul(V,SigmaPlus),Ut);
 // verify four properties
 const ApinvA=matMul(Aplus,A);
 const AApinv=matMul(A,Aplus);
 let check1=0,check2=0,check3=0,check4=0;
 for(let i=0;i<m;i++)for(let j=0;j<n;j++){
  check1=Math.max(check1,Math.abs(matMul(matMul(A,Aplus),A)[i][j]-A[i][j]));
 }
 for(let i=0;i<n;i++)for(let j=0;j<m;j++){
  check2=Math.max(check2,Math.abs(matMul(matMul(Aplus,A),Aplus)[i][j]-Aplus[i][j]));
 }
 const AAplusT=matTranspose(AApinv);
 for(let i=0;i<m;i++)for(let j=0;j<m;j++)check3=Math.max(check3,Math.abs(AAplusT[i][j]-AApinv[i][j]));
 const ApinvAT=matTranspose(ApinvA);
 for(let i=0;i<n;i++)for(let j=0;j<n;j++)check4=Math.max(check4,Math.abs(ApinvAT[i][j]-ApinvA[i][j]));
 return {
  encoded:`A (${m} by ${n}):\n${fmtMat(A)}\n\nSingular values: ${fmtVec(sv)}\n\nA^+ (${n} by ${m}):\n${fmtMat(Aplus)}\n\nMoore-Penrose properties:\n  max |A A^+ A - A|          = ${fmtNum(check1,3)}\n  max |A^+ A A^+ - A^+|      = ${fmtNum(check2,3)}\n  max |(A A^+)^T - A A^+|    = ${fmtNum(check3,3)}\n  max |(A^+ A)^T - A^+ A|    = ${fmtNum(check4,3)}`,
  decoded:`The Moore-Penrose pseudoinverse A^+ exists for any matrix. It generalizes the inverse and gives the minimum norm least squares solution of A x = b.\n\nThe four Moore-Penrose properties listed above uniquely define A^+. All residuals should be close to machine epsilon.\n\nThe pseudoinverse is computed from the SVD as A^+ = V Sigma^+ U^T. The diagonal entries of Sigma^+ are the reciprocals of the nonzero singular values, and zero for the small ones.`,
  steps:m*n,units:k,tokens:1
 };
}

function demoToeplitz(text){
 const A=parseMatrix(text);
 const n=A.length;
 if(n!==A[0].length)throw Error('Toeplitz demo needs a square matrix');
 const diags=[];
 for(let d=-(n-1);d<=n-1;d++){
  const values=[];
  for(let i=0;i<n;i++){const j=i-d;if(j>=0&&j<n)values.push(A[i][j])}
  if(values.length)diags.push({d,values:values.slice(0,4),constant:values.every(v=>Math.abs(v-values[0])<1e-10)});
 }
 const constantCount=diags.filter(x=>x.constant).length;
 const isToeplitz=constantCount===diags.length;
 return {
  encoded:`A (${n} by ${n}):\n${fmtMat(A)}\n\nIs Toeplitz: ${isToeplitz?'yes':'no'}\n\nDiagonals:\n${diags.map(x=>`  d = ${String(x.d).padStart(3)}  first values ${x.values.join(', ')}  ${x.constant?'constant':'NOT constant'}`).join('\n')}`,
  decoded:`A Toeplitz matrix has constant diagonals. Every entry A[i][j] depends only on the difference i - j.\n\nBecause of this structure, only 2n - 1 numbers define the whole matrix. Solving a Toeplitz system costs O(n^2) with the Levinson recursion instead of O(n^3) for a general matrix.\n\nToeplitz matrices appear in signal processing (convolution and filtering), time series analysis (Yule-Walker equations), and numerical methods for differential equations.`,
  steps:n,units:diags.length,tokens:1
 };
}

function demoBareiss(text){
 const A=parseMatrix(text).map(row=>row.map(v=>Math.round(v)));
 const n=A.length;
 if(n!==A[0].length)throw Error('Bareiss needs a square integer matrix');
 if(A.some(r=>r.some(v=>!Number.isInteger(v))))throw Error('All entries must be integers');
 const M=A.map(r=>r.slice());
 let prev=1,sign=1;
 for(let k=0;k<n-1;k++){
  if(M[k][k]===0){
   let found=false;
   for(let i=k+1;i<n;i++)if(M[i][k]!==0){[M[k],M[i]]=[M[i],M[k]];sign=-sign;found=true;break}
   if(!found)return{encoded:`det = 0`,decoded:'The matrix is singular.',steps:k,units:0,tokens:0};
  }
  for(let i=k+1;i<n;i++)for(let j=k+1;j<n;j++)M[i][j]=(M[i][j]*M[k][k]-M[i][k]*M[k][j])/prev;
  prev=M[k][k];
 }
 const det=sign*M[n-1][n-1];
 return {
  encoded:`A (integer):\n${fmtMat(A,0)}\n\nDeterminant (exact, Bareiss): ${det}\n\nFinal matrix:\n${fmtMat(M,0)}`,
  decoded:`Bareiss elimination keeps all intermediate entries as integers when the input matrix has integer entries. This is possible because each division by the previous pivot is exact, a consequence of Sylvester's determinant identity.\n\nThe naive Gaussian elimination would produce fractions. Bareiss avoids them, which is very useful in exact arithmetic, computer algebra and integer programming.\n\nThe final pivot is the determinant. Compare with the floating point result to see the difference between exact and approximate computation.`,
  steps:n,units:n,tokens:1
 };
}

function demoRandomizedSvd(text){
 const A=parseMatrix(text);
 const m=A.length,n=A[0].length;
 // Use full SVD as the reference
 const{U:Ufull,sv:svFull,V:Vfull}=svdFromEigen(A);
 const k=Math.min(m,n,Math.max(2,Math.floor(Math.min(m,n)/2)));
 // Random projection
 const Omega=Array.from({length:n},()=>Array.from({length:k+5},()=>Math.random()-0.5));
 let Y=matMul(A,Omega);
 // one power iteration
 const AtY=matMul(matTranspose(A),Y);
 Y=matMul(A,AtY);
 // orthonormalize Y via QR
 const{Y:_,...qrResult}=(()=>{const qr=qrHouseholder(Y);return{Y:qr.Q,...qr}})();
 const Q=qrResult.Q;
 const B=matMul(matTranspose(Q),A);
 const{sv:svB}=svdFromEigen(B);
 const top=svB.slice(0,k);
 const approxErr=svFull.slice(k).reduce((s,x)=>s+x*x,0);
 return {
  encoded:`A (${m} by ${n}):\n${fmtMat(A)}\n\nTarget rank k = ${k}\n\nFull SVD singular values:\n  ${fmtVec(svFull)}\n\nRandomized SVD top ${k} singular values:\n  ${fmtVec(top)}\n\nRelative approximation error (Frobenius):\n  full tail sum squared = ${fmtNum(approxErr,6)}\n  ||A||_F^2             = ${fmtNum(svFull.reduce((s,x)=>s+x*x,0),6)}\n  ratio                 = ${fmtNum(approxErr/svFull.reduce((s,x)=>s+x*x,0),6)}`,
  decoded:`Randomized SVD multiplies A by a small random matrix Omega, orthonormalizes the result to get Q, then solves a small SVD on Q^T A.\n\nOne or two power iterations improve the accuracy for slowly decaying singular values. With rapidly decaying spectra a single pass is enough.\n\nThe approximation error is roughly the sum of the tail squared singular values beyond the target rank. This is exactly the error of the best rank k approximation by the Eckart-Young theorem.`,
  steps:m*n,units:svFull.length,tokens:1
 };
}

 const n=state.completed.size,t=LESSONS.length;
 $('#progressText').textContent=`${n} / ${t}`;
 $('#progressFill').style.width=(n/t*100)+'%';
 $('#lessonCount').textContent=t+' lessons';
 $('#catalogCount').textContent=`${CHAPTERS.length} chapters · ${t} lessons · ${LESSONS.filter(l=>l.demo&&l.demo!=='none').length} labs`;
 $('#progressBar').setAttribute('aria-valuenow',String(Math.round(n/t*100)));
}
function renderTree(){
 const q=$('#searchInput').value.toLowerCase().trim(),ch=$('#chapterFilter').value;
 const root=$('#courseTree');root.textContent='';
 for(const c of CHAPTERS){
  if(ch!=='all'&&c.id!==ch)continue;
  const rows=c.ids.map(id=>byId[id]).filter(x=>x&&(!q||(x.title+' '+x.summary+' '+x.kind+' '+c.title).toLowerCase().includes(q)));
  if(!rows.length)continue;
  const group=document.createElement('section');
  const label=document.createElement('div');label.className='group-label';
  label.innerHTML=`<span>${esc(c.title)}</span><span>${rows.length}</span>`;
  group.append(label);
  rows.forEach(l=>{
   const b=document.createElement('button');b.type='button';
   b.className='link'+(state.current===l.id?' active':'');
   b.dataset.lesson=l.id;
   b.innerHTML=`<span class="num">${String(LESSONS.indexOf(l)+1).padStart(2,'0')}</span><span class="name">${esc(l.title)}</span>${state.completed.has(l.id)?'<span class="done" aria-label="completed">✓</span>':''}`;
   group.append(b);
  });
  root.append(group);
 }
 if(!root.children.length)root.innerHTML='<p class="muted">No matching lessons. Try another search.</p>';
 progress();
}
function listToHTML(a){return `<ol class="steps">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`}
function refsHTML(r){return r&&r.length?`<div class="references">${r.map(x=>`<a target="_blank" rel="noopener noreferrer" href="${esc(x[1])}">${esc(x[0])} ↗</a>`).join('')}</div>`:'<p class="muted">This lesson is based on standard numerical linear algebra references. See the recommended texts for a full treatment.</p>'}
function codeRecord(l){if(l.codeKey==='none')return null;return CODE[l.codeKey]||CODE[l.demo]||null}
function codeText(l){
 const c=codeRecord(l);
 if(c&&c.python)return c.python;
 return '# CONCEPT OUTLINE, NOT EXECUTABLE PYTHON\n# Lesson: '+l.title+'\n\n# Core idea\n# '+String(l.summary||'').replace(/\n/g,'\n# ')+'\n\n# Pseudocode from the lesson\n'+String(l.pseudo||'').split('\n').map(x=>'# '+x).join('\n')+'\n';
}
function statusClass(l){return /Runnable/.test(l.status)?'good':'warn'}

function renderLesson(id){
 const l=byId[id];if(!l){renderHome();return}
 state.page='lesson';state.current=id;
 const c=getChapter(id);const index=LESSONS.indexOf(l);const next=LESSONS[(index+1)%LESSONS.length];
 const hasDemo=l.demo&&l.demo!=='none';
 const demoArea=hasDemo?`<section class="panel"><div class="panel-head"><h2>${esc(l.demoTitle||'Interactive teaching lab')}</h2><p>Everything runs in your browser as a teaching implementation. It is not a replacement for LAPACK or a production library.</p></div><div class="body"><div class="lab-top"><label for="labInput">Input</label><button class="btn" id="resetSample">Reset sample</button><button class="btn primary" id="runLab">Run lab</button></div><textarea class="lab-input" id="labInput" aria-label="Lab input">${esc(l.sample||'')}</textarea><div class="notice info"><strong>Format:</strong> enter one row per line. Separate values with spaces or commas. For labs that need a right hand side, put the matrix rows, then a blank line, then the vector.</div><div class="lab-cols"><div><div class="label">Output</div><div class="lab-output" id="labEncoded">Run the lab to see output.</div></div><div><div class="label">Explanation</div><div class="lab-output" id="labDecoded">Step notes appear here.</div></div></div></div></section>`:'';
 const references=refsHTML(l.refs);
 const code=state.drafts[id]??codeText(l);
 $('#mainView').innerHTML=`<div class="breadcrumb">Matrix Lab / ${esc(c.title)}</div>
<header class="header">
 <div class="eyebrow">LESSON ${String(index+1).padStart(2,'0')} · ${esc(l.kind)}</div>
 <h1>${esc(l.title)}</h1>
 <p>${esc(l.summary)}</p>
 <div class="tags"><span class="tag">Level ${l.level}</span><span class="tag ${statusClass(l)}">${esc(l.status)}</span><span class="tag">${esc(c.title.replace(/^\d+\.\s*/,''))}</span></div>
 <div class="header-actions">
  <button class="btn" id="bookmarkBtn">${state.bookmarks.has(id)?'★ Bookmarked':'☆ Bookmark'}</button>
  <button class="btn primary" id="completeBtn">${state.completed.has(id)?'✓ Completed':'Mark complete'}</button>
 </div>
</header>
<section class="panel"><div class="panel-head"><h2>1. Understand the idea</h2><p>Plain language and a mental picture</p></div><div class="body idea"><div><p>${esc(l.summary)}</p><p><strong>What problem it solves:</strong> ${esc(l.problem)}</p><div class="takeaway"><strong>Takeaway:</strong> ${esc(l.output)}</div></div><aside class="mental"><small>Mental picture</small><strong>${esc(l.mental)}</strong><p>${esc(l.mentalText)}</p></aside></div></section>
<section class="panel"><div class="panel-head"><h2>2. Input and output</h2><p>Know what goes in and what comes out</p></div><div class="body two"><div class="mini"><h3>Input</h3><p>${esc(l.input)}</p></div><div class="mini"><h3>Output</h3><p>${esc(l.output)}</p></div></div></section>
<section class="panel"><div class="panel-head"><h2>3. How it works</h2><p>Step by step, with the key rule that makes it correct</p></div><div class="body two"><div>${listToHTML(l.steps)}<div class="takeaway" style="margin-top:14px"><strong>Key rule:</strong> ${esc(l.invariant)}</div></div><pre class="pseudo">${esc(l.pseudo)}</pre></div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Step</th><th>What happens</th><th>Why it matters</th></tr></thead><tbody>${l.trace.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
${demoArea}
<section class="panel"><div class="panel-head"><h2>4. Cost and stability</h2><p>Costs depend on matrix size, structure and condition number. These are scope labels, not universal benchmarks.</p></div><div class="body"><div class="tiles">${l.complexity.map((x,i)=>`<div class="tile"><span>${['Time','Storage','Numerics'][i]}</span><strong>${esc(x.split(' ').slice(0,2).join(' '))}</strong><small>${esc(x)}</small></div>`).join('')}</div><div class="two" style="margin-top:12px"><div class="mini"><h3>Strengths</h3><p>${esc(l.strength)}</p></div><div class="mini"><h3>Limits</h3><p>${esc(l.limits)}</p></div></div></div></section>
<section class="panel"><div class="panel-head"><h2>5. Code and usage</h2><p>Reference code is for learning. Real numerical code should use LAPACK, BLAS or a vetted library.</p></div><div class="code-head"><div><span class="tag">${codeRecord(l)?'Python example':'Concept outline, not executable'}</span> <span class="tag">Editable</span></div><div class="header-actions" style="margin:0"><button class="btn" id="copyCode">Copy code</button><button class="btn" id="downloadCode">Download</button></div></div><textarea id="codeEditor" class="code-editor" spellcheck="false" aria-label="Editable Python code">${esc(code)}</textarea><div class="code-foot"><span>${codeRecord(l)?'Reference example. The in-page lab runs its own JavaScript implementation.':'Lesson-specific outline, not an implementation.'}</span><span id="codeStatus">Local draft</span></div><div class="body"><div class="mini"><h3>Where it is used</h3><p>${esc(l.uses)}</p></div><div class="notice" style="margin-top:12px"><strong>Common pitfall:</strong> ${esc(l.pitfall)}</div></div></section>
<section class="panel"><div class="panel-head"><h2>6. Choices and alternatives</h2><p>Pick based on the data, constraints and the guarantee you need</p></div><div class="body two"><div class="mini"><h3>When to use this</h3><p>${esc(l.strength)}</p></div><div class="mini"><h3>When to use something else</h3><p>${esc(l.limits)}</p></div></div></section>
<section class="panel"><div class="panel-head"><h2>7. Check yourself</h2><p>Try to answer before you open the explanation</p></div><div class="body"><details class="practice"><summary>${esc(l.question)}</summary><p>${esc(l.answer)}</p></details></div></section>
<section class="panel"><div class="panel-head"><h2>8. References</h2><p>Standard references for this topic</p></div><div class="body">${references}<p class="muted" style="font-size:11.5px;margin-top:14px">The labs on this page are teaching implementations. For production work use LAPACK, BLAS, Eigen, scipy or another vetted numerical library.</p></div></section>
<footer class="footer"><span>Az Matrix Lab · local learning</span><span>Lesson ${index+1} of ${LESSONS.length} · Next: ${esc(next.title)}</span><button class="btn" id="nextLesson">Next →</button></footer>`;

 $('#bookmarkBtn').onclick=()=>{state.bookmarks.has(id)?state.bookmarks.delete(id):state.bookmarks.add(id);save();renderLesson(id);toast(state.bookmarks.has(id)?'Bookmarked':'Bookmark removed')};
 $('#completeBtn').onclick=()=>{state.completed.has(id)?state.completed.delete(id):state.completed.add(id);save();renderTree();renderLesson(id);toast(state.completed.has(id)?'Lesson completed':'Completion removed')};
 $('#nextLesson').onclick=()=>openLesson(next.id);
 $('#copyCode').onclick=async()=>{const v=$('#codeEditor').value;try{await navigator.clipboard.writeText(v);toast('Code copied')}catch{const ta=$('#codeEditor');ta.select();document.execCommand('copy');toast('Code copied')}};
 $('#downloadCode').onclick=()=>{const r=codeRecord(l);downloadText(`${id}.${r?'py':'txt'}`,$('#codeEditor').value,r?'text/x-python':'text/plain')};
 $('#codeEditor').addEventListener('input',()=>{state.drafts[id]=$('#codeEditor').value;save();$('#codeStatus').textContent='Draft saved locally'});
 if(hasDemo){
  $('#runLab').onclick=()=>runLab(l);
  $('#resetSample').onclick=()=>{$('#labInput').value=l.sample||'';$('#labEncoded').textContent='Run the lab to see output.';$('#labDecoded').textContent='Step notes appear here.'};
  runLab(l,true);
 }
 renderTree();save();
 if(location.hash!==`#${id}`)history.replaceState(null,'',`#${id}`);
}

function renderHome(){
 state.page='home';
 $('#mainView').innerHTML=`<div class="home-hero"><div class="eyebrow">AZ · ENGINEERING TOOLBOOK</div><h1>Understand matrix algorithms from the first dot product to parallel matrix multiplication.</h1><p>A beginner friendly course covering matrix foundations, linear systems, factorizations, orthogonalization, iterative solvers, sparse methods, matrix products and functions, inverses and low rank updates, structured matrices, and large scale parallel algorithms. Every lesson has a plain explanation and most have a runnable lab.</p><div class="header-actions" style="margin:0"><button class="btn primary" id="startFirst">Start at the beginning</button><button class="btn" id="resumeLesson">Continue lesson</button></div></div>
<div class="stats"><div class="stat"><strong>${CHAPTERS.length}</strong><span>chapters</span></div><div class="stat"><strong>${LESSONS.length}</strong><span>lessons</span></div><div class="stat"><strong>${LESSONS.filter(l=>l.demo&&l.demo!=='none').length}</strong><span>runnable labs</span></div><div class="stat"><strong>1</strong><span>standalone HTML file</span></div></div>
<section class="panel"><div class="panel-head"><h2>Honest scope</h2><p>One app covers the whole curriculum. Real numerical software is a separate engineering project.</p></div><div class="body two"><div class="mini"><h3>What runs here</h3><p>Matrix operations, norms, condition number, Gaussian elimination with partial pivoting, LU decomposition, Cholesky, Householder QR, Jacobi eigenvalue algorithm for symmetric matrices, SVD via A^T A, classical and modified Gram-Schmidt, Householder reflector demo, Jacobi and Gauss-Seidel, SOR, conjugate gradient, CSR and CSC sparse formats, Strassen multiplication, Kronecker and Hadamard products, matrix exponential with scaling and squaring, Gauss-Jordan inverse, Sherman-Morrison rank one update, Moore-Penrose pseudoinverse, Toeplitz structure, Bareiss exact integer elimination, and randomized SVD.</p></div><div class="mini"><h3>What does not run here</h3><p>Production LAPACK routines, parallel BLAS, GPU kernels, incomplete LU, algebraic multigrid, domain decomposition, GMRES, MINRES, BiCGSTAB, Smith and Hermite normal forms, sketching, Cannon and SUMMA. For real work use LAPACK, BLAS, scipy.linalg, Eigen, PETSc or an equivalent vetted library.</p></div></div></section>
<div class="panel"><div class="panel-head"><h2>Course map</h2><p>Pick a chapter. The path runs from foundations to large scale methods.</p></div><div class="body"><div class="chapter-cards">${CHAPTERS.map((c,i)=>`<button class="chapter-card" data-chapter="${c.id}"><span class="num">CHAPTER ${String(i+1).padStart(2,'0')} · ${c.ids.length} LESSONS</span><strong>${esc(c.title.replace(/^\d+\.\s*/,''))}</strong><p>${esc(c.desc)}</p></button>`).join('')}</div></div></div>
<footer class="footer"><span>Az Matrix Lab</span><span>Single file · no external runtime dependencies</span></footer>`;
 $('#startFirst').onclick=()=>openLesson('matrix-operations');
 $('#resumeLesson').onclick=()=>openLesson(state.current&&byId[state.current]?state.current:'matrix-operations');
 $('#mainView').querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{const c=CHAPTERS.find(x=>x.id===b.dataset.chapter);if(c)openLesson(c.ids[0])});
}

function renderProgressPage(){
 state.page='progress';
 $('#mainView').innerHTML=`<div class="breadcrumb">Matrix Lab / Bookmarks & progress</div><header class="header"><div class="eyebrow">LOCAL ONLY</div><h1>Bookmarks and progress</h1><p>Your progress stays in this browser. Export the JSON to move it or keep a backup.</p></header>
<section class="panel"><div class="panel-head"><h2>Completed lessons</h2></div><div class="body">${state.completed.size?`<div class="references">${[...state.completed].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No lessons marked complete yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Bookmarks</h2></div><div class="body">${state.bookmarks.size?`<div class="references">${[...state.bookmarks].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No bookmarks yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Progress data</h2></div><div class="body"><div class="header-actions" style="margin:0"><button class="btn primary" id="exportProgress">Export progress JSON</button><button class="btn" id="clearProgress">Clear completion marks</button></div><p class="muted" style="font-size:12.5px;margin-top:14px">Import accepts only known lesson IDs and a supported schema version.</p></div></section>`;
 $('#mainView').querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openLesson(a.dataset.open)});
 $('#exportProgress').onclick=exportProgress;
 $('#clearProgress').onclick=()=>{if(confirm('Clear all completion marks?')){state.completed.clear();save();renderProgressPage();renderTree();toast('Completion marks cleared')}};
}

function openLesson(id){if(!byId[id])return;renderLesson(id);renderTree();$('#mainView').focus({preventScroll:true});window.scrollTo(0,0)}
function downloadText(name,text,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800)}
function exportProgress(){downloadText('az-matrix-lab-progress.json',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts},null,2),'application/json');toast('Progress exported')}
function importProgressFile(file){
 if(file.size>2_000_000){toast('Import rejected: file too large');return}
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||d.schemaVersion!==1||!Array.isArray(d.completed)||!Array.isArray(d.bookmarks)||typeof d.drafts!=='object')throw Error('bad schema');
  if([...d.completed,...d.bookmarks].some(id=>typeof id!=='string'||!byId[id]))throw Error('unknown id');
  state.completed=new Set(d.completed);
  state.bookmarks=new Set(d.bookmarks);
  state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
  state.current=byId[d.current]?d.current:null;
  state.drafts=Object.fromEntries(Object.entries(d.drafts).filter(([k,v])=>byId[k]&&typeof v==='string'&&v.length<100000));
  applyTheme();save();renderTree();
  state.current?openLesson(state.current):renderHome();
  toast('Progress imported');
 }catch(e){toast('Import rejected: invalid progress data')}};
 r.readAsText(file);
}

function bindGlobal(){
 $('#themeSelect').onchange=()=>{state.theme=$('#themeSelect').value;applyTheme();save()};
 $('#printBtn').onclick=()=>print();
 $('#exportBtn').onclick=exportProgress;
 $('#importBtn').onclick=()=>$('#importFile').click();
 $('#importFile').onchange=e=>{if(e.target.files[0])importProgressFile(e.target.files[0]);e.target.value=''};
 $('#searchInput').oninput=renderTree;
 $('#chapterFilter').onchange=renderTree;
 $('#homeLink').onclick=e=>{e.preventDefault();renderHome();history.replaceState(null,'','#home')};
 $('#courseTree').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson)};
 document.querySelectorAll('[data-page="home"]').forEach(b=>b.onclick=renderHome);
 document.querySelectorAll('[data-page="progress"]').forEach(b=>b.onclick=renderProgressPage);
 document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus()}
  if(e.key.toLowerCase()==='t'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
   state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';
   applyTheme();save();
  }
 });
}

function init(){
 load();
 applyTheme();
 CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').append(op)});
 bindGlobal();
 renderTree();
 const hash=location.hash.replace(/^#/,'');
 if(hash&&byId[hash])renderLesson(hash);
 else if(state.current&&byId[state.current])renderLesson(state.current);
 else renderHome();
 progress();
}
init();
</script></body></html>
